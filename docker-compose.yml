version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: easysauda-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: easysauda
      POSTGRES_PASSWORD: easysauda
      POSTGRES_DB: easysauda
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
